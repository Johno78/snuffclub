<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snuff Club 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a printed entry sheet. Red masthead, a scoreboard line, then the list in ruled columns like the paper original. */
:root{
  --paper:#fbfaf8;
  --ink:#1b1a19;
  --muted:#6d6a66;
  --rule:#d9d5cf;
  --red:#c4161c;
  --dead-bg:#f6e3e1;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#161514;--ink:#efece8;--muted:#9a958f;--rule:#34312e;--red:#ff5a5f;--dead-bg:#3a1f20;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161514;--ink:#efece8;--muted:#9a958f;--rule:#34312e;--red:#ff5a5f;--dead-bg:#3a1f20;color-scheme:dark;
}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:980px;margin-inline:auto;min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,9vw,4.6rem);line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:var(--red);margin:0;text-wrap:balance}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;margin-block:18px 6px;padding-block:14px;border-block:2px solid var(--ink)}
.count{font-family:var(--f-display);font-weight:700;font-size:clamp(3rem,12vw,5.5rem);line-height:1;font-variant-numeric:tabular-nums}
.count small{font-size:.4em;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-left:.35em}
.meta{color:var(--muted);font-size:.9rem;min-width:0}
.meta b{color:var(--ink);font-weight:600}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase;margin:30px 0 8px}
.deaths{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.deaths li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding-block:12px;border-bottom:1px solid var(--rule)}
.deaths .n{font-family:var(--f-display);font-weight:700;font-size:1.5rem;text-transform:uppercase;line-height:1.1}
.deaths .d{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums;text-align:right}
.deaths .s{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.deaths .s a{color:var(--ink)}
.empty{color:var(--muted);padding-block:14px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.grid li{font-family:var(--f-display);font-weight:600;font-size:1.2rem;text-transform:uppercase;letter-spacing:.02em;padding:7px 10px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0;overflow-wrap:anywhere}
.grid li.dead{background:var(--dead-bg);color:var(--red);text-decoration:line-through;text-decoration-thickness:2px}
.foot{margin-top:28px;color:var(--muted);font-size:.85rem}
</style>

</head><body>
<div class="wrap">
  <h1>Snuff Club 2026</h1>
  <div class="score">
    <div class="count" id="count">0<small>of 88</small></div>
    <div class="meta" id="meta"></div>
  </div>

  <h2>Confirmed</h2>
  <div id="confirmed"></div>

  <h2>The list</h2>
  <ul class="grid" id="grid"></ul>

  <p class="foot">Checked once a day against major news sources. A name is only crossed off once the death is confirmed, never on rumour.</p>
</div>

<script type="application/json" id="state">{"lastChecked":null,"deaths":[]}</script>
<script>
(function(){
  var NAMES=["Johnny Mathis","Sheila Hancock","Yoko Ono","Douglas Hurd","Herb Alpert","Graham Kerr","James Bolam","Susan Hampshire","Bill Wyman","Vanessa Redgrave","Tom Courtenay","Engelbert Humperdinck","Tippi Hedren","Virginia McKenna","Wendy Craig","Claire Bloom","Nanette Newman","Richard Wilson","William Roache","Joan Collins","Willie Nelson","Barbara Knox","Bill Cosby","Derek Jacobi","Jane Fonda","Shirley MacLaine","Imelda Marcos","Robert Duvall","Stuart Hall","Woody Allen","Judi Dench","Morgan Freeman","Phyllida Law","Warren Beatty","Tom Baker","Ursula Andress","Dustin Hoffman","Jack Nicholson","William Shatner","Kim Novak","Judy Parfitt","Frankie Valli","Princess Alexandra","Gary Player","Amanda Barrie","Dick Van Dyke","Clint Eastwood","Josef Fritzl","Michael Caine","Rupert Murdoch","Ellen Burstyn","Shirley Bassey","Sophia Loren","Roman Polanski","Julian Glover","Robert Wagner","Harriet Andersson","Petula Clark","Eileen Atkins","Anthony Hopkins","Julie Andrews","Buzz Aldrin","Ridley Scott","Edward Fox","Joan Bakewell","Anne Reid","Dennis Skinner","Mary Berry","Michael Aspel","Pat Boone","Michael Heseltine","Jim Dale","Tommy Steele","Annette Crosbie","Angie Dickinson","Judd Hirsch","Brian Blessed","Thelma Barlow","Sian Phillips","Shani Wallis","Barbara Eden","Akihito","Eileen Derbyshire","Tom Skerritt","David Attenborough","Bernie Ecclestone","Len Deighton","Edward Duke of Kent"];
  var state={lastChecked:null,deaths:[]};
  try{state=JSON.parse(document.getElementById('state').textContent)}catch(e){}
  var deaths=state.deaths||[];
  var key=function(s){return String(s).toLowerCase().replace(/[^a-z]/g,'')};
  var deadMap={};deaths.forEach(function(d){deadMap[key(d.name)]=d});

  document.getElementById('count').innerHTML='';
  var c=document.getElementById('count');
  c.appendChild(document.createTextNode(String(deaths.length)));
  var sm=document.createElement('small');sm.textContent='of '+NAMES.length;c.appendChild(sm);

  var meta=document.getElementById('meta');
  function mk(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
  if(state.lastChecked){
    meta.appendChild(document.createTextNode('Last checked '));
    meta.appendChild(mk('b',state.lastChecked));
  }else{
    meta.appendChild(document.createTextNode('First check runs '));
    meta.appendChild(mk('b','4 October, 11:25'));
    meta.appendChild(document.createTextNode(' and covers every death so far in 2026.'));
  }

  var conf=document.getElementById('confirmed');
  if(!deaths.length){
    conf.appendChild(mk('p','Nobody yet. Confirmed deaths will appear here with the date, age and source.','empty'));
  }else{
    var ul=mk('ul',null,'deaths');
    deaths.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date))}).forEach(function(d){
      var li=mk('li');
      li.appendChild(mk('span',d.name,'n'));
      li.appendChild(mk('span',[d.date,d.age!=null&&d.age!==''?'aged '+d.age:''].filter(Boolean).join(' · '),'d'));
      if(d.source){
        var s=mk('span',null,'s');
        if(/^https?:\/\//.test(d.sourceUrl||'')){
          var a=document.createElement('a');a.href=d.sourceUrl;a.target='_blank';a.rel='noopener';a.textContent=d.source;s.appendChild(a);
        }else{s.textContent=d.source}
        li.appendChild(s);
      }
      ul.appendChild(li);
    });
    conf.appendChild(ul);
  }

  var grid=document.getElementById('grid');
  NAMES.forEach(function(n){
    var li=mk('li',n);
    if(deadMap[key(n)])li.className='dead';
    grid.appendChild(li);
  });
})();
</script>
<script>
/* Standalone extras: tap a name to cross it off by hand; saved in this browser only. */
(function(){
  var KEY='snuff-club-2026-manual',saved=[];
  try{saved=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
  var grid=document.getElementById('grid'),count=document.getElementById('count');
  var total=grid.children.length;
  function render(){
    var n=0;
    Array.prototype.forEach.call(grid.children,function(li){
      var on=li.classList.contains('dead')||saved.indexOf(li.textContent)>-1;
      li.classList.toggle('dead',on);if(on)n++;
    });
    count.firstChild.nodeValue=String(n);
  }
  Array.prototype.forEach.call(grid.children,function(li){
    li.style.cursor='pointer';
    li.addEventListener('click',function(){
      var t=li.textContent,k=saved.indexOf(t);
      if(k>-1){saved.splice(k,1);li.classList.remove('dead')}else{saved.push(t);li.classList.add('dead')}
      try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}
      render();
    });
  });
  render();
})();
</script>
</body></html>
