name: Daily check

on:
  schedule:
    - cron: "17 8 * * *"    # 08:17 UTC (09:17 UK in summer, 08:17 in winter). Off the busy :00/:30 slots, which GitHub often delays by hours
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:                      # also runs when this file is changed, so Claude can start a run
    branches: [main]
    paths: ['.github/workflows/daily-check.yml']

permissions:
  contents: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update last checked and any new deaths
        run: python scripts/update_status.py index.html
      - name: Save changes
        run: |
          git config user.name "snuffclub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Daily check" || echo "nothing to commit"
          git pull --rebase origin main
          git push
